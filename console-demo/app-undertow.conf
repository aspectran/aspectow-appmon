# ==============================================================================
# Application Installation and Execution Configuration (Undertow Engine)
# ==============================================================================
# Sourced by setup scripts to configure deployment and runtime variables
# when running with the Undertow servlet engine.

SCRIPT_DIR=$(dirname "$(readlink -f "$0")")
. "$SCRIPT_DIR/app.conf"

# Override process name for Undertow
PROC_NAME="$APP_NAME-undertow"

# Java system properties to be passed to the Aspectran application at runtime.
# Active profiles include 'undertow' to select the Undertow server configuration.
ASPECTRAN_OPTS="
-Duser.timezone=UTC
-Daspectran.profiles.active=dev,gateway,console.custom-ui,undertow
-Daspectran.profiles.base.console=dev,h2,console.custom-ui,undertow
-Daspectran.workPath=$BASE_DIR/app/work
-Daspectran.tempPath=$BASE_DIR/app/temp
-Daspectran.commandsPath=./app/cmd
-Daspectran.logsDir=$BASE_DIR/app/logs
-Daspectow.node.id=dev-console-node1
-Daspectow.node.console=true
-Dtow.server.listener.http.port=8082
-Dtow.context.root.session.cookieName=JSESSIONID_8082
-Dtow.context.console.session.cookieName=JSESSIONID_8082
-Daspectow.console.config.db.h2.path_explicit=~/aspectow-console-demo
"
export ASPECTRAN_OPTS="$ASPECTRAN_OPTS"
